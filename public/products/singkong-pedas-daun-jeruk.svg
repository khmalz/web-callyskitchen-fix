<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
    <defs>
      <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
        <stop offset="0%" stop-color="#FFFDF9" />
        <stop offset="100%" stop-color="#F5EFE6" />
      </radialGradient>
      <linearGradient id="pouchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FEF2F2" />
        <stop offset="50%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#FEF2F2" />
      </linearGradient>
      <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FDE047" />
        <stop offset="100%" stop-color="#047857" />
      </linearGradient>
      <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
        <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2A1F18" flood-opacity="0.12" />
      </filter>
    </defs>

    <!-- Canvas Background -->
    <rect width="400" height="400" rx="24" fill="url(#bgGrad)" />

    <!-- Decorative warm circle -->
    <circle cx="200" cy="180" r="140" fill="#FEF2F2" opacity="0.6" />

    <!-- Standing Snack Pouch -->
    <g filter="url(#softShadow)">
      <!-- Pouch Body -->
      <path d="M120,70 L280,70 L295,310 C295,325 285,335 270,335 L130,335 C115,335 105,325 105,310 Z" fill="url(#pouchGrad)" stroke="#E5D5C5" stroke-width="2" />
      
      <!-- Pouch Top Seal / Ziploc ridges -->
      <path d="M115,70 L285,70 L285,85 L115,85 Z" fill="#B91C1C" rx="4" />
      <line x1="125" y1="77" x2="275" y2="77" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4,3" />

      <!-- Brand Header Banner -->
      <rect x="130" y="100" width="140" height="36" rx="18" fill="#2A1F18" />
      <text x="200" y="123" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#FDF8F1" text-anchor="middle" letter-spacing="1.5">CALLS KITCHEN</text>

      <!-- Flavor Badge -->
      <rect x="140" y="146" width="120" height="24" rx="12" fill="#B91C1C" />
      <text x="200" y="162" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">PEDAS DAUN JERUK</text>

      <!-- Product Name -->
      <text x="200" y="196" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="16" fill="#2A1F18" text-anchor="middle">Keripik Singkong</text>
      <text x="200" y="214" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="10" fill="#8A735E" text-anchor="middle">Aroma Daun Jeruk Pedas Nampol</text>

      <!-- Illustrated Chips Graphic Inside Oval Window -->
      <ellipse cx="200" cy="265" rx="55" ry="35" fill="#FFFDF9" stroke="#B91C1C" stroke-width="2" stroke-dasharray="3,3" />
      
      <!-- Chips Stack -->
      
        <!-- Cassava Chips (wavy edge) -->
        <path d="M170,265 C175,255 190,252 205,258 C215,262 225,258 230,266 C225,276 210,280 195,275 C185,272 175,276 170,265 Z" fill="#FEF08A" stroke="#047857" stroke-width="1.5" />
        <path d="M180,268 C185,260 200,258 212,263 C220,266 222,272 215,276 C205,280 192,278 185,274 Z" fill="#FDE047" stroke="#B91C1C" stroke-width="1.5" opacity="0.9" />
      
      
      <!-- Net Weight Badge -->
      <rect x="175" y="312" width="50" height="15" rx="7" fill="#EAE0D0" />
      <text x="200" y="323" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="8" fill="#564436" text-anchor="middle">NETTO 150g</text>
    </g>

    <!-- Floating crispy pieces around pouch -->
    <ellipse cx="75" cy="240" rx="14" ry="8" fill="#FBBF24" opacity="0.8" transform="rotate(-30 75 240)" />
    <ellipse cx="325" cy="220" rx="16" ry="9" fill="#B91C1C" opacity="0.7" transform="rotate(25 325 220)" />
    <circle cx="95" cy="150" r="4" fill="#D9822B" opacity="0.6" />
    <circle cx="310" cy="130" r="5" fill="#EAB308" opacity="0.6" />
  </svg>